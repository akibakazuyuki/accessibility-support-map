<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="車椅子・ベビーカー・杖などで外出する人のための、段差・幅・坂・エレベーター・トイレがわかる地図（赤羽駅周辺で試験提供）">
<title>アクセシビリティ・サポートマップ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="サポートマップ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  color-scheme:light;
  --paper:#f6f4ef; --card:#ffffff; --card2:#f0f1ee; --line:#d9ddd8;
  --ink:#1b2226; --muted:#56635e;
  --brand:#0a6a8c; --brand-ink:#ffffff;      /* 案内サインの青 */
  --focus:#f2b705;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.6 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#map{position:fixed;inset:0;background:var(--paper)}
.maplibregl-ctrl-attrib{background:rgba(255,255,255,.85)!important;color:var(--muted)!important;font-size:11px}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}

/* ---- 上部：検索 ---- */
.top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:10;max-width:520px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(20,30,30,.14);padding:10px 12px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0 0 6px}
.brand img{width:22px;height:22px}
.brand b{color:var(--ink)}
.trial{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card2)}
.btn{min-height:48px;border:0;border-radius:12px;padding:0 16px;background:var(--brand);color:var(--brand-ink);font-weight:700}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.sugg{list-style:none;margin:8px 0 0;padding:0;max-height:45vh;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;min-height:48px;border:0;border-top:1px solid var(--line);background:none;padding:8px 4px}
.sugg small{display:block;color:var(--muted);font-size:13px}
.msg{margin:8px 0 0;font-size:14px;color:var(--muted)}

/* ---- 右：操作ボタン ---- */
.fabs{position:fixed;right:12px;bottom:calc(var(--sheet-h,150px) + 12px);z-index:10;display:flex;flex-direction:column;gap:10px}
.fab{width:56px;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:0 3px 12px rgba(20,30,30,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.2;gap:2px}
.fab svg{width:22px;height:22px}

/* ---- 下：シート ---- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:560px;background:var(--card);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(20,30,30,.12);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:17px;margin:0 0 4px}
.sheet p{margin:0;font-size:14px;color:var(--muted)}
@media (min-width:900px){ .sheet{left:12px;bottom:12px;border-radius:18px;border:1px solid var(--line)} }

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:5px;border-radius:3px}
.legend i.dash{background:repeating-linear-gradient(90deg,#8a9599 0 5px,transparent 5px 9px)!important}
.legend b{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:18px;border-radius:9px;color:#fff;font-size:10px;padding:0 4px}
.src{margin-top:6px!important;font-size:12px!important}
.src a{color:var(--muted)}
.maplibregl-popup-content{font:14px/1.6 "BIZ UDPGothic","Hiragino Sans",sans-serif;color:var(--ink);padding:12px 14px;border-radius:12px}
.maplibregl-popup-close-button{width:32px;height:32px;font-size:20px}
.pop h3{font-size:15px;margin:0 32px 6px 0}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.pop dt{color:var(--muted)}
.pop dd{margin:0}
.pop .bad{color:#b3261e;font-weight:700}
.pop .warn{color:#8a5300;font-weight:700}
.pop small{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.pop small a{color:var(--muted)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.2)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--brand);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<h1 class="sr">アクセシビリティ・サポートマップ</h1>
<div id="map" role="region" aria-label="地図"></div>

<section class="top" aria-label="場所を探す">
  <p class="brand"><img src="icons/icon.svg" alt=""><b>アクセシビリティ・サポートマップ</b><span class="trial">赤羽で試験提供</span></p>
  <form class="search" id="searchForm" role="search">
    <label for="q" class="sr">行きたい場所</label>
    <input id="q" type="search" placeholder="行きたい場所（施設名・住所）" autocomplete="off" enterkeyhint="search">
    <button class="btn" type="submit">探す</button>
  </form>
  <ul class="sugg" id="sugg" aria-label="検索結果" hidden></ul>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</section>

<div class="fabs">
  <button class="fab" id="btnLocate" type="button" aria-label="現在地を表示">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>現在地</button>
  <button class="fab" id="btnHome" type="button" aria-label="赤羽駅周辺を表示">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M8 21l2-4M16 21l-2-4M5 11h14"/></svg>赤羽駅</button>
</div>

<section class="sheet" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">赤羽駅周辺</h2>
  <p id="sheetText">段差・道幅・坂・トイレ・エレベーターの情報を読み込んでいます…</p>
  <ul class="legend" id="legend" aria-label="凡例" hidden>
    <li><i style="background:#1f8a5b"></i>段差・坂・幅に支障なし</li>
    <li><i style="background:#e08a00"></i>注意（小さな段差・やや急な坂）</li>
    <li><i style="background:#c62828"></i>支障あり（段差・急坂・階段・狭い）</li>
    <li><i class="dash"></i>未調査</li>
    <li><b style="background:#0a6a8c">WC</b>トイレ</li>
    <li><b style="background:#6a3fa0">EV</b>エレベーター</li>
    <li><b style="background:#37474f">入</b>入口</li>
  </ul>
  <p class="src" id="src"></p>
</section>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script>
(function(){
"use strict";
var AKABANE = [35.7780, 139.7208];   // JR赤羽駅
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function km(a,b){ var R=6371,dLa=(b[0]-a[0])*Math.PI/180,dLo=(b[1]-a[1])*Math.PI/180;
  var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(s)); }
function say(t){ $("msg").textContent=t||""; }

// ---- 地図（国土地理院ベクトルタイル。歩く人向けに道・建物・鉄道・地名を描く） ----
var pmProtocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", pmProtocol.tile);
var ANNO_TEXT = ["to-string",["coalesce",["get","vt_text"],["get","knj"],""]];
var map = new maplibregl.Map({
  container:"map", center:[AKABANE[1],AKABANE[0]], zoom:16, minZoom:5, maxZoom:18, attributionControl:{compact:true},
  pitchWithRotate:false, dragRotate:false, localIdeographFontFamily:'"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif',
  style:{
    version:8,
    glyphs:"https://gsi-cyberjapan.github.io/optimal_bvmap/glyphs/{fontstack}/{range}.pbf",
    sources:{
      gsi:{type:"vector",url:"pmtiles://https://cyberjapandata.gsi.go.jp/xyz/optimal_bvmap-v1/optimal_bvmap-v1.pmtiles",
        attribution:'<a href="https://github.com/gsi-cyberjapan/optimal_bvmap" target="_blank" rel="noopener">国土地理院ベクトルタイル</a>'}},
    layers:[
      {id:"bg",type:"background",paint:{"background-color":"#f6f4ef"}},
      {id:"water",type:"fill",source:"gsi","source-layer":"WA",paint:{"fill-color":"#bfd9ee"}},
      {id:"bldg",type:"fill",source:"gsi","source-layer":"BldA",minzoom:14,paint:{"fill-color":"#e4e0d6","fill-outline-color":"#cfc9bb"}},
      {id:"road-case",type:"line",source:"gsi","source-layer":"RdCL",minzoom:12,layout:{"line-cap":"round","line-join":"round"},
        paint:{"line-color":"#cfc8b8","line-width":["interpolate",["linear"],["zoom"],12,1.5,16,8,18,20]}},
      {id:"road",type:"line",source:"gsi","source-layer":"RdCL",layout:{"line-cap":"round","line-join":"round"},
        paint:{"line-color":"#ffffff","line-width":["interpolate",["linear"],["zoom"],10,0.6,16,6,18,17]}},
      {id:"rail",type:"line",source:"gsi","source-layer":"RailCL",paint:{"line-color":"#6e7a80","line-width":["interpolate",["linear"],["zoom"],10,1,16,3]}},
      {id:"label",type:"symbol",source:"gsi","source-layer":"Anno",
        layout:{"text-field":ANNO_TEXT,"text-font":["NotoSansJP-Regular"],"text-size":["interpolate",["linear"],["zoom"],10,11,17,14]},
        paint:{"text-color":"#3a4448","text-halo-color":"#ffffff","text-halo-width":2}}
    ]
  }
});
map.addControl(new maplibregl.ScaleControl({unit:"metric"}),"bottom-left");

// ---- 赤羽駅周辺の歩行空間データ（国交省）と施設（OpenStreetMap） ----
// コードの意味は「歩行空間ネットワークデータ整備仕様」による。99 は不明
var CODE = {
  st:{1:"歩道（車道と分離）",2:"歩道なしの道",3:"横断歩道",4:"横断部（標示なし）",5:"地下通路",6:"歩道橋",7:"建物内の通路",8:"その他"},
  rt:{2:"動く歩道",3:"踏切",4:"エレベーター",5:"エスカレーター",6:"階段",7:"スロープ"},
  w:{1:"1.0m未満",2:"1.0〜2.0m",3:"2.0〜3.0m",4:"3.0m以上"},
  sl:{1:"5%以下",2:"5〜8%（上り）",3:"5〜8%（下り）",4:"8〜18%（上り）",5:"8〜18%（下り）",6:"18%超（上り）",7:"18%超（下り）"},
  lv:{1:"2cm以下",2:"2〜5cm",3:"5〜10cm",4:"10cm超"},
  ev:{1:"なし",2:"あり（バリアフリー非対応）",3:"あり（車椅子対応）",4:"あり（視覚障害者対応）",5:"あり（車椅子・視覚障害者対応）"},
  rf:{1:"なし",2:"あり"},
  cd:{1:"車椅子の通行に支障なし",2:"車椅子の通行に支障あり"},
  dr:{2:"自動ドア",3:"自動ドア（押しボタン）",4:"手動の引き戸",5:"手動の開き戸",6:"回転ドア",7:"その他の扉"},
  sg:{1:"なし",2:"歩車分離式",3:"押しボタン式",4:"あり"},
  hr:{1:"なし",2:"右側",3:"左側",4:"両側"}
};
// 一般的な車椅子利用を想定した色分け（本人の条件での判定はプロフィール機能で行う）
function linkLevel(L){
  if(L.rt===6||L.rt===3||L.lv===3||L.lv===4||(L.sl>=4&&L.sl<=7)||L.w===1||L.cd===2) return "bad";
  if(L.rt===5||L.lv===2||L.sl===2||L.sl===3) return "warn";
  if(L.lv===99&&L.sl===99&&L.w===99&&L.rt!==4&&L.rt!==7) return "unknown";
  return "ok";
}
function why(L){
  var r=[];
  if(L.rt===6) r.push(["bad","階段"]); if(L.rt===3) r.push(["bad","踏切"]); if(L.rt===5) r.push(["warn","エスカレーター"]);
  if(L.lv===3||L.lv===4) r.push(["bad","段差 "+CODE.lv[L.lv]]); else if(L.lv===2) r.push(["warn","段差 "+CODE.lv[L.lv]]);
  if(L.sl>=4&&L.sl<=7) r.push(["bad","坂 "+CODE.sl[L.sl]]); else if(L.sl===2||L.sl===3) r.push(["warn","坂 "+CODE.sl[L.sl]]);
  if(L.w===1) r.push(["bad","幅 "+CODE.w[1]]); if(L.cd===2) r.push(["bad","路面に支障あり"]);
  return r;
}
function row(k,v){ return v==null?"":"<dt>"+esc(k)+"</dt><dd>"+v+"</dd>"; }
function code(t,v){ return CODE[t][v]?esc(CODE[t][v]):(v===99?"不明":null); }
function linkHtml(L){
  var w=why(L), lv=linkLevel(L);
  var head={bad:"車椅子では通りにくい区間",warn:"注意が必要な区間",ok:"段差・坂・幅に支障なし",unknown:"段差・坂・幅は未調査"}[lv];
  var h='<div class="pop"><h3>'+esc(head)+'</h3><dl>';
  h+=row("種類",esc(CODE.rt[L.rt]||CODE.st[L.st]||"通路"));
  if(w.length) h+=row("理由",w.map(function(x){ return '<span class="'+x[0]+'">'+esc(x[1])+'</span>'; }).join("、"));
  h+=row("段差",code("lv",L.lv))+row("幅",code("w",L.w))+row("坂",code("sl",L.sl))+row("長さ",L.d?Math.round(L.d)+"m":null);
  if(L.ev!==1&&L.ev!==99) h+=row("エレベーター",code("ev",L.ev));
  if(L.dr!==1&&L.dr!==99) h+=row("扉",code("dr",L.dr));
  if(L.rf===2) h+=row("屋根","あり");
  if(L.sg>1&&L.sg!==99) h+=row("信号",code("sg",L.sg));
  return h+'</dl><small>出典：国土交通省 歩行空間ネットワークデータ'+(L.md?'（調査 '+esc(L.md)+'）':'')+'</small></div>';
}
var WC={yes:"車椅子で利用可",limited:"一部利用可",no:"車椅子では利用不可",designated:"車椅子専用あり"};
function poiHtml(p){
  var t=p.t, kind={toilet:"トイレ",elevator:"エレベーター",entrance:"入口",place:"施設"}[p.k];
  var h='<div class="pop"><h3>'+esc(t.name||kind)+'</h3><dl>'+row("種類",esc(kind));
  var wc=t["toilets:wheelchair"]&&p.k!=="toilet"?t["toilets:wheelchair"]:null;
  h+=row("車椅子",t.wheelchair?esc(WC[t.wheelchair]||t.wheelchair):"未確認");
  if(wc) h+=row("車椅子トイレ",esc(WC[wc]||wc));
  if(p.k==="toilet"&&t.changing_table) h+=row("おむつ台",t.changing_table==="yes"?"あり":"なし");
  if(t.door||t.automatic_door) h+=row("扉",esc(t.automatic_door==="yes"?"自動ドア":t.door));
  if(t.step_count) h+=row("段数",esc(t.step_count)+"段");
  if(t.width) h+=row("幅",esc(t.width)+"m");
  if(t.level) h+=row("階",esc(t.level));
  if(t.opening_hours) h+=row("利用時間",esc(t.opening_hours));
  if(t["wheelchair:description"]) h+=row("メモ",esc(t["wheelchair:description"]));
  var id=p.osm, url="https://www.openstreetmap.org/"+({n:"node",w:"way",r:"relation"}[id[0]])+"/"+id.slice(1);
  return h+'</dl><small>出典：<a href="'+url+'" target="_blank" rel="noopener">OpenStreetMap</a>（利用者による登録。現地と違う場合があります）</small></div>';
}
var LEVEL_COLOR=["match",["get","lv"],"bad","#c62828","warn","#e08a00","ok","#1f8a5b","#8a9599"];
var area=null, pop=null;
function showPop(ll,html){ if(pop) pop.remove(); pop=new maplibregl.Popup({offset:10,maxWidth:"300px"}).setLngLat(ll).setHTML(html).addTo(map); }
function loadArea(){
  fetch("data/akabane.json").then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(A){
    area=A;
    var lf=A.links.map(function(L,i){ return {type:"Feature",properties:{i:i,lv:linkLevel(L)},geometry:{type:"LineString",coordinates:L.c}}; });
    var pf=A.pois.map(function(p,i){ var wc=p.t.wheelchair||p.t["toilets:wheelchair"];
      return {type:"Feature",properties:{i:i,k:p.k,ok:wc==="yes"||wc==="designated"?1:wc==="no"?-1:0},geometry:{type:"Point",coordinates:p.ll}}; });
    map.addSource("links",{type:"geojson",data:{type:"FeatureCollection",features:lf},attribution:"歩行空間データ：国土交通省"});
    map.addSource("pois",{type:"geojson",data:{type:"FeatureCollection",features:pf},attribution:"施設 &copy; OpenStreetMap contributors"});
    map.addLayer({id:"links-unknown",type:"line",source:"links",filter:["==",["get","lv"],"unknown"],layout:{"line-cap":"butt"},
      paint:{"line-color":"#8a9599","line-width":["interpolate",["linear"],["zoom"],14,1.5,18,5],"line-dasharray":[2,1.5]}});
    map.addLayer({id:"links",type:"line",source:"links",filter:["!=",["get","lv"],"unknown"],layout:{"line-cap":"round","line-join":"round"},
      paint:{"line-color":LEVEL_COLOR,"line-width":["interpolate",["linear"],["zoom"],14,2.5,18,8]}});
    map.addLayer({id:"pois",type:"circle",source:"pois",filter:["!=",["get","k"],"place"],
      paint:{"circle-radius":["interpolate",["linear"],["zoom"],14,5,18,11],
        "circle-color":["match",["get","k"],"toilet","#0a6a8c","elevator","#6a3fa0","#37474f"],"circle-stroke-color":"#ffffff","circle-stroke-width":2}});
    map.addLayer({id:"pois-label",type:"symbol",source:"pois",minzoom:16,filter:["!=",["get","k"],"place"],
      layout:{"text-field":["match",["get","k"],"toilet","WC","elevator","EV","入"],"text-font":["NotoSansJP-Regular"],"text-size":10,"text-allow-overlap":true},
      paint:{"text-color":"#ffffff"}});
    ["links","links-unknown"].forEach(function(id){
      map.on("click",id,function(e){ showPop(e.lngLat,linkHtml(A.links[e.features[0].properties.i])); });
      map.on("mouseenter",id,function(){ map.getCanvas().style.cursor="pointer"; }); map.on("mouseleave",id,function(){ map.getCanvas().style.cursor=""; });
    });
    map.on("click","pois",function(e){ var p=A.pois[e.features[0].properties.i]; showPop(p.ll,poiHtml(p)); });
    var n={bad:0,warn:0,ok:0,unknown:0}; lf.forEach(function(f){ n[f.properties.lv]++; });
    var wcs=A.pois.filter(function(p){ return p.k==="toilet"; }).length, evs=A.pois.filter(function(p){ return p.k==="elevator"; }).length;
    if(!destMarker) $("sheetText").textContent="歩道 "+A.links.length+"区間（支障あり "+n.bad+"・注意 "+n.warn+"・未調査 "+n.unknown+"）、トイレ "+wcs+"か所、エレベーター "+evs+"か所。線や印を押すと詳しい情報が出ます。";
    $("legend").hidden=false;
    var s=A.sources[0];
    $("src").innerHTML='出典：<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a>'+(s.surveyed?'（調査 '+esc(s.surveyed[0])+(s.surveyed[1]!==s.surveyed[0]?'〜'+esc(s.surveyed[1]):'')+'）':'')+'・施設は OpenStreetMap';
  }).catch(function(){ $("sheetText").textContent="段差・道幅・坂の情報を読み込めませんでした。通信状況を確かめて開き直してください。"; });
}
if(map.isStyleLoaded()) loadArea(); else map.once("style.load",loadArea);

// 右のボタンが下のシートに重ならないように
if(window.ResizeObserver) new ResizeObserver(function(){ var wide=window.innerWidth>=900;
  document.documentElement.style.setProperty("--sheet-h",wide?"12px":document.querySelector(".sheet").offsetHeight+"px"); }).observe(document.querySelector(".sheet"));

// ---- 現在地 ----
var me=null, meMarker=null;
function placeMe(){
  if(!meMarker){ var el=document.createElement("div"); el.className="me"; el.setAttribute("aria-label","現在地"); meMarker=new maplibregl.Marker({element:el}).setLngLat([me[1],me[0]]).addTo(map); }
  else meMarker.setLngLat([me[1],me[0]]);
}
function locate(){
  if(!navigator.geolocation){ say("この端末では現在地を使えません"); return; }
  say("現在地を探しています…");
  navigator.geolocation.getCurrentPosition(function(p){
    me=[p.coords.latitude,p.coords.longitude]; placeMe(); say("");
    map.flyTo({center:[me[1],me[0]],zoom:Math.max(map.getZoom(),16)});
  }, function(){ say("現在地が取れませんでした。端末の設定で位置情報を許可してください"); }, {enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
$("btnLocate").onclick=locate;
$("btnHome").onclick=function(){ map.flyTo({center:[AKABANE[1],AKABANE[0]],zoom:16}); };

// ---- 場所の検索（国土地理院の地名・住所＋OpenStreetMap） ----
function photon(q){
  return fetch("https://photon.komoot.io/api/?lang=default&limit=8&q="+encodeURIComponent(q)+"&lat="+AKABANE[0]+"&lon="+AKABANE[1]+"&bbox=122,20,154,46")
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){ return (j.features||[]).map(function(f){ var p=f.properties||{};
      return {name:p.name||p.street||"", addr:[p.state,p.county,p.city,p.district,p.street].filter(Boolean).join(""), ll:[f.geometry.coordinates[1],f.geometry.coordinates[0]]}; })
      .filter(function(c){ return c.name; }); });
}
function nominatim(q){
  return fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=jp&accept-language=ja&limit=8&q="+encodeURIComponent(q))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(a){ return a.map(function(x){ var parts=(x.display_name||"").split(",").map(function(t){return t.trim();});
      return {name:x.name||parts[0], addr:parts.slice(1).reverse().filter(function(t){return !/^\d{3}-?\d{4}$/.test(t)&&t!=="日本";}).join(""), ll:[+x.lat,+x.lon]}; }); });
}
function gsi(q){
  return fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q))
    .then(function(r){ return r.json(); })
    .then(function(a){ return (a||[]).slice(0,5).map(function(x){ return {name:x.properties.title, addr:"住所・地名", ll:[x.geometry.coordinates[1],x.geometry.coordinates[0]]}; }); });
}
var seq=0, destMarker=null;
function search(q){
  var my=++seq; q=q.trim(); if(!q) return;
  say("探しています…"); $("sugg").hidden=true;
  Promise.all([photon(q),nominatim(q),gsi(q)].map(function(p){ return p.catch(function(){ return []; }); })).then(function(rs){
    if(my!==seq) return;
    var out=[], base=me||AKABANE;
    [].concat.apply([],rs).forEach(function(c){
      if(!c.ll||isNaN(c.ll[0])) return;
      if(out.some(function(d){ return d.name===c.name && km(d.ll,c.ll)<0.2; })) return;
      c.d=km(base,c.ll); out.push(c);
    });
    out.sort(function(a,b){ return a.d-b.d; }); out=out.slice(0,10);
    var ul=$("sugg"); ul.innerHTML="";
    if(!out.length){ say("見つかりませんでした。別の言い方で試してください"); return; }
    out.forEach(function(c){
      var li=document.createElement("li"), b=document.createElement("button"); b.type="button";
      b.innerHTML=esc(c.name)+"<small>"+esc(c.addr)+"・"+(c.d<1?Math.round(c.d*1000)+"m":c.d.toFixed(1)+"km")+"</small>";
      b.onclick=function(){ pick(c); };
      li.appendChild(b); ul.appendChild(li);
    });
    ul.hidden=false; say(out.length+"件見つかりました");
  });
}
function pick(c){
  $("sugg").hidden=true; say("");
  if(!destMarker){ var el=document.createElement("div"); el.className="pin"; destMarker=new maplibregl.Marker({element:el,anchor:"bottom"}); }
  destMarker.setLngLat([c.ll[1],c.ll[0]]).addTo(map);
  map.flyTo({center:[c.ll[1],c.ll[0]],zoom:17});
  $("sheetTitle").textContent=c.name;
  var inArea=area&&c.ll[0]>=area.bbox[0]&&c.ll[0]<=area.bbox[2]&&c.ll[1]>=area.bbox[1]&&c.ll[1]<=area.bbox[3];
  $("sheetText").textContent=(c.addr?c.addr+"。":"")+(inArea?"周りの歩道の色と印で、段差・坂・トイレを確かめられます。":"段差・道幅・坂の情報は、いまは赤羽駅周辺だけです。");
}
$("searchForm").onsubmit=function(e){ e.preventDefault(); $("q").blur(); search($("q").value); };

// ---- オフラインでも開けるように（PWA） ----
if("serviceWorker" in navigator) window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
})();
</script>
