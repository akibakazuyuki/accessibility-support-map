name: Build area data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"   # 毎週月曜 3:00（日本時間）。OSM の更新を取り込む
  push:
    paths: [scripts/build_area.py, .github/workflows/area-data.yml]
permissions:
  contents: write
concurrency:
  group: area-data-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && python3 scripts/build_area.py
      - run: ls -la data data/areas && du -sh data
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/akabane.json data/areas.json data/areas
          git diff --cached --quiet || (git commit -m "Update area accessibility data" && git pull --rebase && git push)
